services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "40m"

  api1:
    image: rinha-2026:latest
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "155m"

  api2:
    image: rinha-2026:latest
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "155m"

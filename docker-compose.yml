services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "20m"

  api1:
    image: rafaeltakahashi/rinha-2026:latest
    volumes:
      - sockets:/sockets
    environment:
      - SOCKET_PATH=/sockets/api1.sock
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "165m"

  api2:
    image: rafaeltakahashi/rinha-2026:latest
    volumes:
      - sockets:/sockets
    environment:
      - SOCKET_PATH=/sockets/api2.sock
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "165m"

volumes:
  sockets:

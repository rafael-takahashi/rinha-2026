[package]
name = "fraud-detection"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bytemuck = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
memmap2 = "0.9"
ordered-float = "5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

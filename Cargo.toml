[package]
name = "fraud-detection"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
kiddo = { version = "5.3", features = ["rkyv_08"] }
memmap2 = "0.9"
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.3"
tokio = { version = "1", features = ["full"] }
